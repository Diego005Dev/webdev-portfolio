name: accessibility

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: npm start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run pa11y
        run: npx pa11y http://localhost:3000 --reporter html > pa11y-report.html || true

      - name: Run axe CLI
        run: npx @axe-core/cli http://localhost:3000 --save --output axe-report.json || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            pa11y-report.html
            axe-report.json
