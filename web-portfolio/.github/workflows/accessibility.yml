name: Accessibility Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          nohup npm run start &
          # wait for server to be ready
          npx wait-on http://localhost:3000

      - name: Run axe-core CLI
        run: npx @axe-core/cli http://localhost:3000 --save --output=./reports/axe-report.json || true

      - name: Run Lighthouse (accessibility only)
        run: npx lighthouse http://localhost:3000 --only-categories=accessibility --output=json --output-path=./reports/lighthouse-report.json || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            ./reports/axe-report.json
            ./reports/lighthouse-report.json
